spring.application.name=modeloT1PSW

# ===== Base de datos H2 en memoria (no requiere instalar nada) =====
# Se crea al iniciar la aplicación y se borra al detenerla.
spring.datasource.url=jdbc:h2:mem:matricula;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Logs
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.t1_pruebas_software=WARN

# SQL de Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Banner de Spring Boot
spring.main.banner-mode=off

# ===== Alternativa MySQL (solo si ya la tienes instalada) =====
# spring.datasource.url=jdbc:mysql://localhost:3306/bdmatricula
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=mysql
# spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=8080
